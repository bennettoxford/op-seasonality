name: Render and Publish Quarto

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Set up R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      # Install R packages
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::ggplot2
            any::dplyr
            any::readr
            any::knitr
            any::rmarkdown
            any::scales
            any::gt
            any::here
            any::arrow
            any::tsibble
            any::feasts
            any::ggrepel
            any::patchwork
            any::webshot2
            any::fpp3
            any::bizdays
            any::timeDate
            any::glue
            any::purr
            any::urca
            

      # Set up Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Render Quarto
      - name: Render Quarto
        uses: quarto-dev/quarto-actions/render@v2

      # Upload rendered site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4